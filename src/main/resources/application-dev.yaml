spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/sharefilesdb
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

    show-sql: off
aws:
  s3:
    endpoint: http://localhost:4566
    region: us-east-1
    access-key: admin
    secret-key: admin
    bucket: files

callback:
    url: http://localhost:8080/api/v1/files/callback