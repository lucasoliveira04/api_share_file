name: files_service

services:
  localstack:
    image: localstack/localstack:4.8.1
    container_name: files-service-localstack

    ports:
      - "4566:4566"

    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1

    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"