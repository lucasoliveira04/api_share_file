name: files_service

services:
  db:
    image: postgres:18
    container_name: filedb
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharefilesdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d cdb" ]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.8.1
    container_name: files-service-localstack

    ports:
      - "4566:4566"

    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 1

    volumes:
      - "./localstack-data:/var/lib/localstack"
      - "./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh"

volumes:
  postgres_data: